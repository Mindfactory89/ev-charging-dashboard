<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0f" />
    <title>Mobility Intelligence – Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100dvh; margin: 0; padding: 24px; place-items: center; color: #f7f4ee; background: #080a0f; }
      main { width: min(100%, 520px); padding: 32px; border: 1px solid #303743; border-radius: 24px; background: #11151d; box-shadow: 0 24px 64px rgba(0,0,0,.35); }
      img { width: 64px; height: 64px; border-radius: 16px; }
      p { color: #b7bec9; line-height: 1.65; }
      button { min-height: 48px; padding: 0 20px; border: 1px solid #d5ab70; border-radius: 14px; color: #11151d; background: #e8c58f; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/mobility-icon-192.png" alt="" />
      <h1>Du bist gerade offline.</h1>
      <p>Das Dashboard konnte noch nicht vollständig aus dem lokalen App-Speicher geladen werden. Sobald die Verbindung wieder da ist, kannst du direkt weitermachen.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
